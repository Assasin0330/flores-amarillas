<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cartas 💌</title>

<link rel="stylesheet" href="styles.css">
</head>

<body class="fondo-cartas">

<div class="contenedor-cartas">

    <h1>💌 Cartas Especiales 💌</h1>

    <div class="botones">

        <button onclick="abrirCarta('mama')">MAMÁ</button>

        <button onclick="abrirCarta('tia')">TÍA</button>

        <button onclick="abrirCarta('lorena')">AMA LORENA</button>

        <button onclick="abrirCarta('carmen')">MAMI CARMEN</button>

        <button onclick="abrirCarta('pita')">PITA</button>

    </div>

    <!-- imagen -->
    <img id="imagenCarta" src="mama.jpg">

</div>

<!-- MODAL -->
<div id="modal" class="modal">

    <div class="carta-box">

        <span class="candado">🔒</span>

        <img id="cartaImg" class="blur" src="">

        <input type="password" id="password" placeholder="Contraseña">

        <button onclick="desbloquear()">
            Desbloquear
        </button>

        <button onclick="cerrarCarta()">
            ⬅ Regresar
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
